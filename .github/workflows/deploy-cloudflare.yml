name: Deploy Cloudflare

on:
  repository_dispatch:
    types: [content-updated]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache fetched content
        uses: actions/cache@v4
        with:
          path: .content
          key: content-${{ github.event.client_payload.sha || 'main' }}
      - run: npm ci
      - name: Build static site
        env:
          CONTENT_REF: ${{ github.event.client_payload.sha || 'main' }}
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://portfolio.labbys-aoai.in
        run: npm run check
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
